version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - git clone --depth 1 --branch "$GIT_REF" "$REPO_URL" src
      - TAG=$(git -C src rev-parse --short HEAD)
      - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
  build:
    on-failure: ABORT
    commands:
      - docker build -f "src/$DOCKERFILE" -t "$IMAGE_URI:$TAG" -t "$IMAGE_URI:latest" src
  post_build:
    commands:
      - '[ "$CODEBUILD_BUILD_SUCCEEDING" = 1 ] || exit 1'
      - docker push "$IMAGE_URI:$TAG"
      - docker push "$IMAGE_URI:latest"
      - echo "pushed $IMAGE_URI:$TAG"
